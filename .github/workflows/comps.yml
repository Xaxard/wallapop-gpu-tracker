name: comps-loop

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: comps-loop
  cancel-in-progress: false

permissions:
  contents: write   # needed only for the keepalive commit below

jobs:
  comps:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run comps loop
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python comps_loop.py

      # GitHub disables scheduled workflows after 60 days without repo activity,
      # which would silently kill both loops. A daily heartbeat commit keeps the
      # repo "active" without spamming the history.
      - name: Keepalive heartbeat
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          if [ -n "$(git status --porcelain .keepalive)" ] && \
             [ "$(git log -1 --format=%cd --date=format:%F -- .keepalive)" != "$(date -u +%F)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "chore: keepalive"
            git push
          fi
